# Builds the desktop app's installers. jpackage can only package for the OS it runs on,
# so each platform is built on its own runner. Run it from the Actions tab, or push a
# tag such as v1.0.0 to also attach the files to a GitHub release.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Test and package
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :desktop:packageDistributionForCurrentOS

      - name: Cross-platform jar
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon :desktop:crossPlatformJar

      - uses: actions/upload-artifact@v4
        with:
          name: lexis-desktop-${{ runner.os }}
          path: |
            desktop/build/compose/binaries/main/*/*.msi
            desktop/build/compose/binaries/main/*/*.exe
            desktop/build/compose/binaries/main/*/*.dmg
            desktop/build/compose/binaries/main/*/*.deb
            desktop/build/compose/binaries/main/*/*.rpm
            desktop/build/dist/*.jar
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/*/*.msi
            desktop/build/compose/binaries/main/*/*.exe
            desktop/build/compose/binaries/main/*/*.dmg
            desktop/build/compose/binaries/main/*/*.deb
            desktop/build/compose/binaries/main/*/*.rpm
            desktop/build/dist/*.jar
